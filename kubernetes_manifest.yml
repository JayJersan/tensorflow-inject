apiVersion: apps/v1
kind: Deployment
metadata:
  name: mymodel-serving
  namespace: tensorflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mymodel-serving
  template:
    metadata:
      labels:
        app: mymodel-serving
    spec:
      containers:
      - name: mymodel-serving
        image: esh279/mymodel-serving:latest
        ports:
        - containerPort: 8501
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: mymodel-serving
  namespace: tensorflow
spec:
  type: NodePort
  selector:
    app: mymodel-serving
  ports:
  - port: 8501
    targetPort: 8501
    nodePort: 30111
